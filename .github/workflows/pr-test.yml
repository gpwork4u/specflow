name: PR Build & Lint

# CI 只做兩件事：
#   1. 程式碼能 build 過（tsc / go build / 等）
#   2. Linter 沒紅
#
# 所有 test（unit / contract-check / bddgen 0 undefined / BDD scenario）都在本地跑：
#   bash .claude/scripts/local-checks.sh
# engineer / qa agent 在 push 前必須跑過、綠燈才能發 PR。
#
# 為什麼這樣切：
#   - docker compose + playwright 在 CI 上慢、port 衝突、不易 debug
#   - 本地有 image cache、可直接 show-trace、可重現
#   - sprint 收斂頻率低，不需要每個 PR 都重跑 e2e
#   - CI 只擋「連編譯都過不了」的 PR，避免明顯 typo / import 缺失合進 main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('dev/package.json') != '' || hashFiles('test/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # dev/ build
      - name: Build dev (if Node project)
        if: hashFiles('dev/package.json') != ''
        working-directory: dev
        run: |
          npm ci --silent 2>/dev/null || npm install --silent
          if grep -q '"build"' package.json; then
            npm run build
          elif [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "ℹ️  no build / tsconfig — skip"
          fi

      # dev/ build (Go)
      - name: Build dev (if Go project)
        if: hashFiles('dev/go.mod') != ''
        working-directory: dev
        run: |
          go build ./...

      # dev/ lint
      - name: Lint dev (if available)
        if: hashFiles('dev/package.json') != ''
        working-directory: dev
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "ℹ️  no lint script — skip"
          fi

      # test/ build (TypeScript step definitions 也要能編)
      - name: Build test (if Node project)
        if: hashFiles('test/package.json') != ''
        working-directory: test
        run: |
          npm ci --silent 2>/dev/null || npm install --silent
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "ℹ️  no tsconfig — skip"
          fi
